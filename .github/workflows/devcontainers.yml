name: Dev Containers

on:
  push:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainers.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    branches: [main]
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainers.yml"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:


jobs:
  validate:
    name: Validate ${{ matrix.name }} devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            config: .devcontainer/devcontainer.json
          - name: memory-stack
            config: .devcontainer/memory-stack/devcontainer.json
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Remove existing devcontainer
        run: |
          docker ps -aq \
            --filter "label=devcontainer.local_folder=${GITHUB_WORKSPACE}" \
            --filter "label=devcontainer.config_file=${GITHUB_WORKSPACE}/${{ matrix.config }}" \
            | xargs -r docker rm -f
      - name: Start devcontainer
        working-directory: ${{ github.workspace }}
        run: |
          devcontainer up \
            --workspace-folder . \
            --config "${{ matrix.config }}" \
            --remove-existing-container
      - name: Run common devcontainer smoke checks
        working-directory: ${{ github.workspace }}
        run: |
          devcontainer exec \
            --workspace-folder . \
            --config "${{ matrix.config }}" \
            bash -lc '
              set -euo pipefail
              git rev-parse --is-inside-work-tree
              uv --version
              node --version
              gh --version
              uv run --no-sync python -c "import headroom"
            '
      - name: Check memory-stack services and imports
        if: matrix.name == 'memory-stack'
        working-directory: ${{ github.workspace }}
        run: |
          devcontainer exec \
            --workspace-folder . \
            --config "${{ matrix.config }}" \
            bash -lc '
              set -euo pipefail
              timeout 120 bash -c "until (echo > /dev/tcp/qdrant/6333) >/dev/null 2>&1; do sleep 2; done"
              timeout 120 bash -c "until (echo > /dev/tcp/neo4j/7687) >/dev/null 2>&1; do sleep 2; done"
              uv run --no-sync python -c "import mem0; from qdrant_client import QdrantClient; from neo4j import GraphDatabase"
            '
  validate-worktree:
    name: Validate linked worktree devcontainer
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORKTREE: ${{ runner.temp }}/headroom-worktree
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Install Dev Container CLI
        run: npm install --global @devcontainers/cli
      - name: Create linked Git worktree
        run: |
          rm -rf "$WORKTREE"
          git worktree add --detach "$WORKTREE" HEAD
      - name: Remove existing devcontainer
        run: |
          docker ps -aq \
            --filter "label=devcontainer.local_folder=${WORKTREE}" \
            --filter "label=devcontainer.config_file=${WORKTREE}/.devcontainer/devcontainer.json" \
            | xargs -r docker rm -f
      - name: Start devcontainer from linked worktree
        working-directory: ${{ env.WORKTREE }}
        run: |
          devcontainer up \
            --workspace-folder . \
            --config .devcontainer/devcontainer.json \
            --remove-existing-container
      - name: Run linked worktree smoke checks
        working-directory: ${{ env.WORKTREE }}
        run: |
          devcontainer exec \
            --workspace-folder . \
            --config .devcontainer/devcontainer.json \
            bash -lc '
              set -euo pipefail
              git rev-parse --is-inside-work-tree
              uv run --no-sync python -c "import headroom"
            '
